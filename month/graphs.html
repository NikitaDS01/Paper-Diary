<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Графики месяца — макет A5</title>
<link rel="stylesheet" href="../assets/pages.css">
<style>
  .canvas { gap: 3.5mm; }
  .sec > h2 { margin-bottom: 5px; }

  /* ось Y слева, поле графика, под ним общая линейка дней */
  .chart {
    display: grid;
    grid-template-columns: 5.5mm 1fr;
    grid-template-rows: auto auto;
    column-gap: 3px;
    row-gap: 2px;
  }
  .ax {
    height: calc(var(--h) + 3px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-end;
  }
  .ax .axv { height: 0; line-height: 0; font-size: 7px; color: var(--muted); }

  .plot {
    position: relative;
    height: var(--h);
    border: 1.4px solid var(--line-strong);
    background-color: #fff;
    background-image: repeating-linear-gradient(
      to bottom,
      var(--line) 0 1px,
      transparent 1px calc(var(--h) / var(--n))
    );
  }
  /* рамки поля графика отъедают 1.4px с каждой стороны — компенсируем,
     чтобы числа линейки стояли ровно под своими колонками */
  .strip {
    grid-column: 2;
    display: flex;
    flex-direction: column;
    border-left: 1.4px solid transparent;
    border-right: 1.4px solid transparent;
  }
  .strip .srow { display: flex; }
  .strip .srow > span { flex: 1; text-align: center; }
  .strip .sl { height: 8px; border-bottom: 1.2px dotted var(--line-strong); }
  .strip .sd { height: 8px; line-height: 8px; font-size: 6.5px; color: #6f6858; }

  /* расшифровка линий: обе подписываешь сам */
  .crow { display: flex; align-items: center; gap: 5px; margin-top: 4px; font-size: 8.5px; }
  .crow .key { flex: none; width: 15px; height: 0; border-top: 2px solid var(--ac, var(--c-orange)); }
  .crow .key.dash { border-top-style: dotted; }
  .crow .ln { height: 13px; }
  .symrow { display: flex; align-items: center; gap: 8px; margin-top: 3px; font-size: 8.5px; color: #6f6858; }
  .symrow .s { font-size: 11px; }
</style>
</head>
<body>
<div class="bar no-print">
  <a href="../index.html">← Оглавление</a>
  <button onclick="print()">Печать A5</button>
</div>

<div class="sheet">
  <section class="page">
    <aside class="rail"><i></i><i></i><i></i></aside>
    <div class="canvas" style="--ac: var(--c-orange)">
      <header class="ph">
        <div>
          <div class="kick">Месяц</div>
          <h1>Графики месяца</h1>
        </div>
        <div class="meta"><span class="blank" style="min-width:22mm"></span> · <span class="blank" style="min-width:12mm"></span> г.</div>
      </header>

      <section class="sec" style="--ac: #b06f2e">
        <h2>Настроение и погода</h2>
        <div class="chart" style="--h: 32mm; --n: 4">
          <div class="ax" data-axis="5" data-axis-from="1"></div>
          <div class="plot"></div>
          <div class="strip" data-strip="31" data-strip-letters></div>
        </div>
        <div class="crow">
          <span class="key"></span><span class="ln"></span>
          <span class="key dash"></span><span class="ln"></span>
        </div>
        <div class="symrow">
          <span><span class="s">☀</span> <span class="blank" style="min-width:16mm"></span></span>
          <span><span class="s">☁</span> <span class="blank" style="min-width:16mm"></span></span>
          <span><span class="s">☂</span> <span class="blank" style="min-width:16mm"></span></span>
          <span><span class="s">❄</span> <span class="blank" style="min-width:16mm"></span></span>
        </div>
      </section>

      <section class="sec" style="--ac: #3e6b9e">
        <h2>Сон, часов</h2>
        <div class="chart" style="--h: 32mm; --n: 6">
          <div class="ax" data-axis="10" data-axis-from="4"></div>
          <div class="plot"></div>
          <div class="strip" data-strip="31" data-strip-letters></div>
        </div>
        <div class="crow">
          <span class="key"></span><span class="ln"></span>
          <span class="key dash"></span><span class="ln"></span>
        </div>
      </section>

      <section class="sec" style="--ac: #4a7c59">
        <h2>Энергия</h2>
        <div class="chart" style="--h: 28mm; --n: 4">
          <div class="ax" data-axis="10" data-axis-from="2" data-axis-step="2"></div>
          <div class="plot"></div>
          <div class="strip" data-strip="31" data-strip-letters></div>
        </div>
        <div class="crow">
          <span class="key"></span><span class="ln"></span>
          <span class="key dash"></span><span class="ln"></span>
        </div>
      </section>

      <p class="hint">Точка над числом = значение за этот день, точки соединяй линией. В подписях линий запиши, что за что отвечает; шкалу слева при желании переподпиши под себя.</p>
    </div>
  </section>
</div>
<script src="../assets/grid.js"></script>
</body>
</html>
