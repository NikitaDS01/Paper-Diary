<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Фильмы — макет A5</title>
<link rel="stylesheet" href="../assets/pages.css">
<style>
  .canvas { gap: 4mm; }
  .sec .tbl td { height: 22px; }
</style>
</head>
<body>
<div class="bar no-print">
  <a href="../index.html">← Оглавление</a>
  <button onclick="print()">Печать A5</button>
</div>

<div class="sheet">
  <section class="page">
    <aside class="rail"><i></i><i></i><i></i></aside>
    <div class="canvas" style="--ac: var(--c-blue)">
      <header class="ph">
        <div>
          <div class="kick">Год</div>
          <h1>Фильмы</h1>
        </div>
        <div class="meta"><span class="blank" style="min-width:14mm"></span> год</div>
      </header>

      <section class="sec" style="--ac:#3e6b9e">
        <h2>Фильмы</h2>
        <table class="tbl">
          <colgroup><col style="width:7mm"><col><col style="width:18mm"><col style="width:22mm"></colgroup>
          <thead>
            <tr><th class="c">№</th><th>Название</th><th class="c">Дата*</th><th class="c">Оценка</th></tr>
          </thead>
          <tbody>
            <tr class="ex"><td class="c">1</td><td>Начало</td><td class="c">12.01</td><td class="c stars">★★★★★</td></tr>
            <tr><td class="c">2</td><td></td><td></td><td></td></tr>
            <tr><td class="c">3</td><td></td><td></td><td></td></tr>
            <tr><td class="c">4</td><td></td><td></td><td></td></tr>
            <tr><td class="c">5</td><td></td><td></td><td></td></tr>
            <tr><td class="c">6</td><td></td><td></td><td></td></tr>
            <tr><td class="c">7</td><td></td><td></td><td></td></tr>
            <tr><td class="c">8</td><td></td><td></td><td></td></tr>
            <tr><td class="c">9</td><td></td><td></td><td></td></tr>
            <tr><td class="c">10</td><td></td><td></td><td></td></tr>
            <tr><td class="c">11</td><td></td><td></td><td></td></tr>
            <tr><td class="c">12</td><td></td><td></td><td></td></tr>
            <tr><td class="c">13</td><td></td><td></td><td></td></tr>
            <tr><td class="c">14</td><td></td><td></td><td></td></tr>
            <tr><td class="c">15</td><td></td><td></td><td></td></tr>
            <tr><td class="c">16</td><td></td><td></td><td></td></tr>
            <tr><td class="c">17</td><td></td><td></td><td></td></tr>
            <tr><td class="c">18</td><td></td><td></td><td></td></tr>
            <tr><td class="c">19</td><td></td><td></td><td></td></tr>
            <tr><td class="c">20</td><td></td><td></td><td></td></tr>
            <tr><td class="c">21</td><td></td><td></td><td></td></tr>
          </tbody>
        </table>
      </section>
      <p class="hint">*Дата — когда посмотрел фильм. Серые строки — примеры.</p>
    </div>
  </section>
</div>
<script src="../assets/grid.js"></script>
</body>
</html>
